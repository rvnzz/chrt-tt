name: web

# Пуш в main → собранный web (ghcr.io/rvnzz/chrt-tt-web:latest)

on:
  push:
    branches: [main]
    # Пересборка нужна только при изменениях, влияющих на web-бандл.
    # Доки/воркфлоу/нативные куски — не триггерят.
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (WEB)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/rvnzz/chrt-tt-web:latest
            ghcr.io/rvnzz/chrt-tt-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
