name: web

# Пуш в main → собранный web (ghcr.io/rvnzz/chrt-tt-web:latest)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (WEB)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/rvnzz/chrt-tt-web:latest
            ghcr.io/rvnzz/chrt-tt-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
