name: eas-build

# Ручная сборка (Actions → Run workflow):
#   - preview     : APK (автоключ EAS)
#   - production  : AAB (свой upload-keystore)
# Автосборки убраны: Android-билды происходят только по тегам (release.yml).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (Android)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

env:
  PROFILE: ${{ inputs.profile }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Restore own keystore (production)
        if: ${{ env.PROFILE == 'production' }}
        run: |
          echo "${{ secrets.CREDENTIALS_JSON_B64 }}" | base64 -d > credentials.json

      - name: Install dependencies
        run: npm ci

      - name: Build Android (${{ env.PROFILE }})
        run: |
          npx eas-cli build \
            -p android \
            --profile "$PROFILE" \
            --non-interactive \
            --json > build.json

          echo "build_url=$(python3 -c 'import json; print(json.load(open("build.json"))[0]["buildUrl"])')" >> "$GITHUB_OUTPUT"
          echo " Artifact: $(python3 -c 'import json; print(json.load(open("build.json"))[0]["buildUrl"])')"
